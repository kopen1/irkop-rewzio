  /api/v1/rewards: {get: {tags: [rewards], security: [{bearerAuth: []}], responses: {'200': {description: Success}}}}
  /api/v1/missions: {get: {tags: [missions], security: [{bearerAuth: []}], responses: {'200': {description: Success}}}}

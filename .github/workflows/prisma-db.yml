name: Rewzio Prisma DB

on:
  push:
    paths:
      - 'services/api/prisma/**'
      - 'services/api/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/prisma-db.yml'
  pull_request:
    paths:
      - 'services/api/prisma/**'
      - 'services/api/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/prisma-db.yml'

permissions:
  contents: read

jobs:
  prisma:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rewzio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rewzio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rewzio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - run: npm --workspace @rewzio/api run db:generate
      - run: npm --workspace @rewzio/api run db:validate
      - name: Test database against current Prisma schema
        shell: bash
        run: |
          set -euo pipefail
          if find services/api/prisma/migrations -mindepth 2 -name migration.sql -print -quit | grep -q .; then
            npm --workspace @rewzio/api run db:migrate:deploy
          else
            echo 'INFO: no committed Prisma migration found; using db push only against temporary CI PostgreSQL'
            npm --workspace @rewzio/api exec -- prisma db push --skip-generate
          fi
      - run: npm --workspace @rewzio/api run db:seed

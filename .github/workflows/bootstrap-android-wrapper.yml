name: Bootstrap Android Gradle Wrapper

on:
  push:
    branches: [master]
    paths: ['.github/workflows/bootstrap-android-wrapper.yml']
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate wrapper and finalize Android workflow
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          cd ../..
          cat > .github/workflows/android.yml <<'EOF'
          name: Android Debug APK
          on:
            push:
              branches: [master]
              paths:
                - 'apps/android/**'
                - '.github/workflows/android.yml'
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            android-build:
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: apps/android
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'
                    cache: gradle
                - uses: android-actions/setup-android@v3
                - name: Install Android SDK
                  run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
                - name: Verify Gradle wrapper
                  run: ./gradlew --version
                - name: Clean
                  run: ./gradlew clean --no-daemon
                - name: Assemble debug APK
                  run: ./gradlew assembleDebug --no-daemon
                - name: Verify APK
                  run: test -s app/build/outputs/apk/debug/app-debug.apk
                - name: Upload debug APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: rewzio-debug-apk
                    path: apps/android/app/build/outputs/apk/debug/app-debug.apk
                    if-no-files-found: error
          EOF
          rm -f .github/workflows/bootstrap-android-wrapper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/gradlew apps/android/gradlew.bat apps/android/gradle/wrapper/gradle-wrapper.jar apps/android/gradle/wrapper/gradle-wrapper.properties .github/workflows/android.yml .github/workflows/bootstrap-android-wrapper.yml
          git commit -m 'fix(android): make debug apk build reproducible'
          git push origin master

name: Bootstrap Android Gradle Wrapper

on:
  push:
    branches: [master]
    paths: ['.github/workflows/bootstrap-android-wrapper.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m 'fix(android): make debug apk build reproducible'
          git push origin master

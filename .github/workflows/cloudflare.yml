name: Rewzio Cloudflare

on:
  push:
    branches: [migration/cloudflare]
    paths:
      - 'services/api/**'
      - 'packages/**'
      - 'infrastructure/cloudflare/**'
      - 'scripts/cloudflare/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/migration/cloudflare'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate D1 schema
        run: node scripts/cloudflare/generate-d1-schema.mjs > /tmp/rewzio-d1.sql
      - name: Prepare Cloudflare config
        env:
          D1_ID: ${{ secrets.REWZIO_STAGING_D1_ID }}
        run: |
          test -n "$D1_ID"
          sed "s/__SET_WITH_WRANGLER__/$D1_ID/g" wrangler.toml > /tmp/wrangler.toml
      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute rewzio-staging --remote --file=/tmp/rewzio-d1.sql --config=/tmp/wrangler.toml
      - name: Deploy API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=/tmp/wrangler.toml

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/cloudflare/generate-d1-schema.mjs > /tmp/rewzio-d1.sql
      - name: Prepare production config
        env:
          D1_ID: ${{ secrets.REWZIO_PRODUCTION_D1_ID }}
        run: |
          test -n "$D1_ID"
          sed "s/__SET_WITH_WRANGLER__/$D1_ID/g" wrangler.toml > /tmp/wrangler.toml
      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute rewzio --remote --file=/tmp/rewzio-d1.sql --config=/tmp/wrangler.toml --env production
      - name: Deploy API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=/tmp/wrangler.toml --env production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rewzio
      POSTGRES_PASSWORD: rewzio
      POSTGRES_DB: rewzio
    ports:
      - "5432:5432"
    volumes:
      - rewzio-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - rewzio-redis:/data

volumes:
  rewzio-postgres:
  rewzio-redis:
